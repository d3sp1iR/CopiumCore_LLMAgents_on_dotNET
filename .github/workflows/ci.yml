name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CopiumCore.slnx
      - name: Build
        run: dotnet build CopiumCore.slnx -c Release --no-restore
      - name: Test
        run: dotnet test CopiumCore.slnx -c Release --no-build
